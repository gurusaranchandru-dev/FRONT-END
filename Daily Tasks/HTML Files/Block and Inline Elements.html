<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline Identifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .block-element {
            background-color: #e0e0e0;
            border: 2px solid #757575;
            margin: 10px 0;
            padding: 10px;
            border-radius: 12px;
        }

        .inline-element {
            background-color: #ffcdd2;
            border: 2px solid #e53935;
            margin: 5px;
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- 3 Block Elements -->
    <div class="block-element">Block Element 1</div>
    <div class="block-element">Block Element 2</div>
    <div class="block-element">Block Element 3</div>

    <br><br>

    <!-- 3 Inline Elements -->
    <span class="inline-element">Inline Element 1</span>
    <span class="inline-element">Inline Element 2</span>
    <span class="inline-element">Inline Element 3</span>

</body>
</html>
