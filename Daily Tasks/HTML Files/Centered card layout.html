<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;          
      display: flex;
      justify-content: center;      
      align-items: center;          
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 280px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 25px;
      text-align: center;
      box-sizing: border-box;
    }

    .avatar {
      width: 80px;
      height: 80px;
      line-height: 80px;
      margin: 0 auto 15px;
      background-color: #2c3e50;
      color: white;
      font-size: 36px;
      font-weight: bold;
      border-radius: 50%;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 22px;
      color: #2c3e50;
    }

    .role {
      margin: 0 0 15px;
      color: red;
      font-size: 15px;
      font-weight: bold;
    }

    .bio {
      margin: 0 0 20px;
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background-color: #2c3e50;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
    }

    .btn:hover {
      background-color:red;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">C</div>
    <h1>Chandru</h1>
    <p class="role">Java Developer</p>
    <p class="bio">I build projects a Ice Cream Parlour Project.</p>
    <a class="btn" href="https://github.com/gurusaranchandru-dev/Ice-Cream-Parlour">View GitHub</a>
  </div>

</body>
</html>
