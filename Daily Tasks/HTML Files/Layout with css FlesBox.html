<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox Navbar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between; 
      align-items: center;            
      background-color: white;
      padding: 10px 25px;
      border-bottom: 3px solid #e50914;
    }

    .logo img {
      height: 40px;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: #222;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .nav-links a:hover {
      color: #e50914;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="c:\Users\Dell\Downloads\marvel-logo-34288.png" alt="Logo">
    </div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
