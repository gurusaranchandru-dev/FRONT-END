<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools Inspector Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .selectable {
            cursor: pointer;
            transition: outline 0.1s ease;
        }
        .active-target {
            outline: 2px dashed #0284c7 !important;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">

    <main class="w-full max-w-2xl bg-white border border-slate-300 rounded-xl shadow-sm overflow-hidden">
        
        <!-- Web Page Container -->
        <div class="p-6 border-b border-slate-200 space-y-4">
            <!-- Block Elements -->
            <div id="target-1" 
                 data-tag="<div>" 
                 data-display="block" 
                 class="selectable active-target bg-gray-200 border border-gray-400 rounded-lg p-3 text-sm text-gray-800 font-medium">
                Block Element 1 (&lt;div&gt;)
            </div>

            <div id="target-2" 
                 data-tag="<div>" 
                 data-display="block" 
                 class="selectable bg-gray-200 border border-gray-400 rounded-lg p-3 text-sm text-gray-800 font-medium">
                Block Element 2 (&lt;div&gt;)
            </div>

            <div id="target-3" 
                 data-tag="<div>" 
                 data-display="block" 
                 class="selectable bg-gray-200 border border-gray-400 rounded-lg p-3 text-sm text-gray-800 font-medium">
                Block Element 3 (&lt;div&gt;)
            </div>

            <!-- Inline Elements -->
            <div class="pt-2 space-x-2">
                <span id="target-4" 
                      data-tag="<span>" 
                      data-display="inline" 
                      class="selectable inline-block bg-red-100 border border-red-400 text-red-700 font-medium text-sm px-3 py-1.5 rounded-lg">
                    Inline Element 1 (&lt;span&gt;)
                </span>

                <span id="target-5" 
                      data-tag="<span>" 
                      data-display="inline" 
                      class="selectable inline-block bg-red-100 border border-red-400 text-red-700 font-medium text-sm px-3 py-1.5 rounded-lg">
                    Inline Element 2 (&lt;span&gt;)
                </span>

                <span id="target-6" 
                      data-tag="<span>" 
                      data-display="inline" 
                      class="selectable inline-block bg-red-100 border border-red-400 text-red-700 font-medium text-sm px-3 py-1.5 rounded-lg">
                    Inline Element 3 (&lt;span&gt;)
                </span>
            </div>
        </div>

        <!-- DevTools Inspector Panel -->
        <div class="bg-slate-900 text-slate-100 p-4 font-mono text-xs sm:text-sm">
            <div class="text-slate-400 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-slate-700">
                Developer Tools Inspector
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <span class="text-slate-400 block text-[11px]">Selected Tag:</span>
                    <span id="inspector-tag" class="text-amber-400 font-bold">&lt;div&gt;</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-[11px]">Display Rule:</span>
                    <span id="inspector-display" class="text-emerald-400 font-bold">display: block;</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectables = document.querySelectorAll('.selectable');
            const inspectorTag = document.getElementById('inspector-tag');
            const inspectorDisplay = document.getElementById('inspector-display');

            selectables.forEach(el => {
                el.addEventListener('click', () => {
                    selectables.forEach(item => item.classList.remove('active-target'));
                    el.classList.add('active-target');

                    const tag = el.getAttribute('data-tag');
                    const display = el.getAttribute('data-display');

                    inspectorTag.textContent = tag;
                    inspectorDisplay.textContent = `display: ${display};`;
                });
            });
        });
    </script>
</body>
</html>
